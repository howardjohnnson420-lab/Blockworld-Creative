name: Validate Android build workflow
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/validate_android_workflow.yml"
      - ".github/workflows/android-apk-064.yml"
jobs:
  validate-workflow:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate workflow YAML structure
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          paths = [Path(".github/workflows/android-apk.yml"), Path(".github/workflows/android-apk-064.yml")]
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              doc = yaml.safe_load(text)
              if not isinstance(doc, dict):
                  raise SystemExit(f"{path}: workflow root is not a mapping")
              jobs = doc.get("jobs")
              if not isinstance(jobs, dict) or not jobs:
                  raise SystemExit(f"{path}: no jobs mapping found. Root keys={list(doc.keys())!r}")
              job = jobs.get("android-apk")
              if not isinstance(job, dict):
                  raise SystemExit(f"{path}: android-apk job missing; found={list(jobs)!r}")
              steps = job.get("steps")
              if not isinstance(steps, list):
                  raise SystemExit(f"{path}: android-apk.steps is not a list")
              names = [step.get("name", "<unnamed>") for step in steps if isinstance(step, dict)]
              print(f"{path}: YAML parses. jobs={list(jobs)} steps={len(steps)}")
              for i, name in enumerate(names, 1):
                  print(f"{i:02d}. {name}")
              if len([name for name in names if name == "Import and export Android debug APK"]) != 1:
                  raise SystemExit(f"{path}: expected exactly one import/smoke-test/export step")
              if len([name for name in names if name == "Switch Android to OpenGL Compatibility and tune mobile rendering"]) != 1:
                  raise SystemExit(f"{path}: expected exactly one Android Compatibility renderer step")
              if len([name for name in names if name == "Publish OpenGL Compatibility screenshot and logs"]) != 1:
                  raise SystemExit(f"{path}: expected exactly one graphical smoke artifact step")
              if len([name for name in names if name == "Publish the APK as a workflow artifact"]) != 1:
                  raise SystemExit(f"{path}: expected exactly one APK publish step")
          PY
