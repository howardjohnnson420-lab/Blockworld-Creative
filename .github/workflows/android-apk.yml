      - name: Fix vertical atlas UVs and cull internal fluid faces
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/scripts/world.gd" "$PROJECT_DIR/VERSION.txt" <<'PY'
          from pathlib import Path
          import sys

          world_path = Path(sys.argv[1])
          version_path = Path(sys.argv[2])
          source = world_path.read_text()

          # Keep a block's top edge attached to the top row of its 16x16 texture.
          # In the mesh's vertical-face vertex order, positions are bottom/top/top/bottom.
          old_cube = '            face_uv = [_tile_uv(tile_index, 0, 0), _tile_uv(tile_index, 0, 1), _tile_uv(tile_index, 1, 1), _tile_uv(tile_index, 1, 0)]'
          new_cube = "\n".join([
              "            if face_index in [0, 1, 4, 5]:",
              "                face_uv = [_tile_uv(tile_index, 0, 1), _tile_uv(tile_index, 0, 0), _tile_uv(tile_index, 1, 0), _tile_uv(tile_index, 1, 1)]",
              "            else:",
              "                face_uv = [_tile_uv(tile_index, 0, 0), _tile_uv(tile_index, 0, 1), _tile_uv(tile_index, 1, 1), _tile_uv(tile_index, 1, 0)]",
          ])
          if source.count(old_cube) != 1:
              raise SystemExit(f"Expected one cube UV assignment, found {source.count(old_cube)}")
          source = source.replace(old_cube, new_cube, 1)

          # Fluid voxels currently emit all six faces even where an adjacent voxel is
          # exactly the same fluid. These coincident surfaces z-fight into the repeating
          # triangles seen in the ocean and add an enormous amount of unnecessary geometry.
          helper_anchor = 'func _append_shaped_block_geometry(cell: Vector3i, shape_id: String, tiles: Dictionary, block_solid: bool, state: Dictionary, vertices: PackedVector3Array, uvs: PackedVector2Array, normals: PackedVector3Array, colors: PackedColorArray, indices: PackedInt32Array, collision_faces: PackedVector3Array) -> void:'
          fluid_helper = "\n".join([
              "func _fluid_surface_height(cell: Vector3i) -> float:",
              "    var fluid_id := get_block_id(cell)",
              '    if fluid_id not in ["water", "lava"]:',
              "        return 0.0",
              "    var fluid_state := get_block_state(cell)",
              '    var fluid_level := int(fluid_state.get("level", 0))',
              '    var fluid_source := bool(fluid_state.get("source", fluid_level == 0))',
              '    var falling := bool(fluid_state.get("falling", false)) or fluid_level == 8',
              '    return 1.0 if fluid_source or falling else clampf(1.0 - float(fluid_level) / 8.0, 0.125, 1.0)',
              "",
              "",
          ])
          if source.count(helper_anchor) != 1:
              raise SystemExit("Shaped geometry function anchor missing")
          source = source.replace(helper_anchor, fluid_helper + helper_anchor, 1)

          shape_start = source.index(helper_anchor)
          shape_end = source.index('\nfunc _fence_connects_to', shape_start)
          shaped = source[shape_start:shape_end]
          face_name_marker = '            var face_name := "side"'
          fluid_face_block = "\n".join([
              "            var face_box_min := box_min",
              "            var face_box_max := box_max",
              '            if shape_id == "fluid" and at_cell_boundary and neighbour_id == get_block_id(cell):',
              "                # Shared fluid faces cause z-fighting and excessive triangles in oceans.",
              "                if face_index in [2, 3]:",
              "                    continue",
              "                var adjacent_height := _fluid_surface_height(cell + DIRECTIONS[face_index])",
              "                if adjacent_height >= box_max.y - 0.0001:",
              "                    continue",
              "                face_box_min.y = maxf(box_min.y, adjacent_height)",
              "                if face_box_min.y >= face_box_max.y - 0.0001:",
              "                    continue",
              "",
          ])
          if shaped.count(face_name_marker) != 1:
              raise SystemExit(f"Face-name insertion target count {shaped.count(face_name_marker)}")
          shaped = shaped.replace(face_name_marker, fluid_face_block + face_name_marker, 1)

          # The base face UVs must use a vertical flip for cuboid sides but not top/bottom.
          uv_start = shaped.find("            var face_uvs: Array[Vector2] = [")
          uv_end = shaped.find("            for corner_index in range(4):", uv_start)
          if uv_start < 0 or uv_end < 0:
              raise SystemExit("Shaped face UV section not found")
          new_shaped_uv = "\n".join([
              "            var face_uvs: Array[Vector2]",
              "            if face_index in [0, 1, 4, 5]:",
              "                face_uvs = [",
              "                    _tile_uv(tile_index, 0, 1), _tile_uv(tile_index, 0, 0),",
              "                    _tile_uv(tile_index, 1, 0), _tile_uv(tile_index, 1, 1)",
              "                ]",
              "            else:",
              "                face_uvs = [",
              "                    _tile_uv(tile_index, 0, 0), _tile_uv(tile_index, 0, 1),",
              "                    _tile_uv(tile_index, 1, 1), _tile_uv(tile_index, 1, 0)",
              "                ]",
              "",
          ])
          shaped = shaped[:uv_start] + new_shaped_uv + shaped[uv_end:]
          for a, b in [
              ("lerpf(box_min.x, box_max.x, unit_corner.x)", "lerpf(face_box_min.x, face_box_max.x, unit_corner.x)"),
              ("lerpf(box_min.y, box_max.y, unit_corner.y)", "lerpf(face_box_min.y, face_box_max.y, unit_corner.y)"),
              ("lerpf(box_min.z, box_max.z, unit_corner.z)", "lerpf(face_box_min.z, face_box_max.z, unit_corner.z)"),
          ]:
              if shaped.count(a) != 1:
                  raise SystemExit(f"Face bounds mapping target count for {a}: {shaped.count(a)}")
              shaped = shaped.replace(a, b, 1)
          source = source[:shape_start] + shaped + source[shape_end:]

          # Apply the same correct orientation to crossed plant cards (grass, flowers,
          # crops). Leaf litter is horizontal, so its existing UV map stays unchanged.
          plant_start = source.index('func _append_plant_geometry(')
          plant_end = source.index('\nfunc _tile_uv_pixel', plant_start)
          plant = source[plant_start:plant_end]
          plant_uv_start = plant.find("            var face_uvs: Array[Vector2] = [")
          plant_uv_end = plant.find("            var normal := original_normal", plant_uv_start)
          if plant_uv_start < 0 or plant_uv_end < 0:
              raise SystemExit("Plant face UV section not found")
          new_plant_uv = "\n".join([
              "            var face_uvs: Array[Vector2] = [",
              "                _tile_uv(tile_index, 0, 1), _tile_uv(tile_index, 0, 0),",
              "                _tile_uv(tile_index, 1, 0), _tile_uv(tile_index, 1, 1)",
              "            ]",
              "",
          ])
          plant = plant[:plant_uv_start] + new_plant_uv + plant[plant_uv_end:]
          source = source[:plant_start] + plant + source[plant_end:]

          world_path.write_text(source)
          version_path.write_text("0.5.8\n")
          print("Applied upright vertical UV mapping and same-fluid internal-face culling.")
          PY
      - name: Correct face winding and optimize chunk generation
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json
          import sys

          project = Path(sys.argv[1])
          path = project / "scripts/world.gd"
          source = path.read_text()

          # Godot ArrayMesh's front-face convention is clockwise. These voxel quads
          # were indexed in the opposite order with back-face culling enabled.
          winding_replacements = [
              (
                  "PackedInt32Array([base_index, base_index + 1, base_index + 2, base_index, base_index + 2, base_index + 3])",
                  "PackedInt32Array([base_index, base_index + 2, base_index + 1, base_index, base_index + 3, base_index + 2])",
              ),
              (
                  "PackedInt32Array([base_index, base_index+1, base_index+2, base_index, base_index+2, base_index+3])",
                  "PackedInt32Array([base_index, base_index+2, base_index+1, base_index, base_index+3, base_index+2])",
              ),
              (
                  "PackedInt32Array([base_index,base_index+1,base_index+2,base_index,base_index+2,base_index+3])",
                  "PackedInt32Array([base_index,base_index+2,base_index+1,base_index,base_index+3,base_index+2])",
              ),
          ]
          changed = 0
          for old, new in winding_replacements:
              count = source.count(old)
              if count:
                  source = source.replace(old, new)
                  changed += count
          if changed < 5:
              raise SystemExit(f"Expected at least five voxel quad index sites; fixed only {changed}")

          # Enable a short-lived base-block cache while generating a chunk. Face tests
          # query neighbouring cells, so without this cache terrain/cave/ore code runs
          # repeatedly for the same positions.
          if "var _generation_base_cache_active :=" not in source:
              anchor = "var _spawn_cache_valid := false"
              if source.count(anchor) != 1:
                  raise SystemExit("Generation-cache field anchor missing")
              source = source.replace(
                  anchor,
                  anchor + "\nvar _generation_base_cache: Dictionary = {}\nvar _generation_base_cache_active := false",
                  1,
              )

          base_signature = "func _base_block_at(cell: Vector3i) -> String:"
          if source.count(base_signature) != 1:
              raise SystemExit("Expected one base-block function")
          source = source.replace(base_signature, "func _base_block_at_uncached(cell: Vector3i) -> String:", 1)
          wrapper = """func _base_block_at(cell: Vector3i) -> String:
              if _generation_base_cache_active and _generation_base_cache.has(cell):
                  return str(_generation_base_cache[cell])
              var result := _base_block_at_uncached(cell)
              if _generation_base_cache_active:
                  _generation_base_cache[cell] = result
              return result

          """
          source = source.replace(
              "func _base_block_at_uncached(cell: Vector3i) -> String:",
              wrapper + "func _base_block_at_uncached(cell: Vector3i) -> String:",
              1,
          )

          # The RNG argument to _ore_or_stone was unused; constructing one for every
          # underground voxel provided no randomness, only extra allocation cost.
          rng_call = "_ore_or_stone(cell.x, cell.y, cell.z, _rng_for_cell(cell))"
          if source.count(rng_call) != 1:
              raise SystemExit("Unused per-cell RNG call not found exactly once")
          source = source.replace(rng_call, "_ore_or_stone(cell.x, cell.y, cell.z)", 1)
          ore_signature = "func _ore_or_stone(x: int, y: int, z: int, rng: RandomNumberGenerator) -> String:"
          if source.count(ore_signature) != 1:
              raise SystemExit("Ore helper signature anchor missing")
          source = source.replace(ore_signature, "func _ore_or_stone(x: int, y: int, z: int) -> String:", 1)

          load_marker = "    # First cache column heights for the entire chunk. Then materialize only"
          if source.count(load_marker) != 1:
              raise SystemExit("Chunk generation cache start marker missing")
          source = source.replace(
              load_marker,
              "    _generation_base_cache.clear()\n"
              "    _generation_base_cache_active = true\n"
              + load_marker,
              1,
          )
          vegetation_marker = "    _generate_chunk_vegetation(coord)"
          if source.count(vegetation_marker) != 1:
              raise SystemExit("Chunk generation cache cleanup marker missing")
          source = source.replace(
              vegetation_marker,
              "    _generation_base_cache_active = false\n"
              "    _generation_base_cache.clear()\n"
              + vegetation_marker,
              1,
          )
          source = source.replace(
              "    blocks.clear()\n    surface_heights.clear()",
              "    blocks.clear()\n"
              "    _generation_base_cache.clear()\n"
              "    _generation_base_cache_active = false\n"
              "    surface_heights.clear()",
              1,
          )

          # Do not eagerly evaluate _base_block_at() as a dictionary default value.
          # Dictionary.get(key, expensive_call()) evaluates expensive_call first.
          vis_start = source.index("func _base_cell_has_visible_face(cell: Vector3i, block_id: String) -> bool:")
          vis_end = source.index("\nfunc _write_generated_block", vis_start)
          if vis_start < 0 or vis_end < 0:
              raise SystemExit("Visible-face helper boundaries missing")
          visible_function = """func _base_cell_has_visible_face(cell: Vector3i, block_id: String) -> bool:
              var definition := BlockRegistry.get_block(block_id)
              var current_transparent := bool(definition.get("transparent", false))
              var directions: Array[Vector3i] = [Vector3i.RIGHT, Vector3i.LEFT, Vector3i.UP, Vector3i.DOWN, Vector3i.BACK, Vector3i.FORWARD]
              for direction in directions:
                  var neighbour_cell := cell + direction
                  var neighbour_key := _cell_key(neighbour_cell)
                  var neighbour_id := "air"
                  if modifications.has(neighbour_key):
                      neighbour_id = str(modifications[neighbour_key])
                  elif blocks.has(neighbour_cell):
                      neighbour_id = str(blocks[neighbour_cell])
                  else:
                      neighbour_id = _base_block_at(neighbour_cell)
                  if neighbour_id == "air":
                      return true
                  var neighbour_def := BlockRegistry.get_block(neighbour_id)
                  var neighbour_transparent := bool(neighbour_def.get("transparent", false))
                  var neighbour_solid := bool(neighbour_def.get("solid", false))
                  if neighbour_id != block_id and (current_transparent or neighbour_transparent or not neighbour_solid):
                      return true
              return false
          """
          source = source[:vis_start] + visible_function.rstrip() + source[vis_end:]

          # Restrict the periodic expensive point-light scan to block types that can
          # emit light. Generate the ID set from the full shipped block registry.
          blocks_path = project / "assets/data/blocks.json"
          block_rows = json.loads(blocks_path.read_text())["blocks"]
          light_ids = sorted(
              set(
                  block_id for block_id, row in block_rows.items()
                  if float(row.get("emission", 0.0) or 0.0) > 0.0
              )
              | {"redstone_lamp", "campfire", "soul_campfire"}
          )
          light_constant = "const POTENTIAL_LIGHT_SOURCE_IDS := {" + ", ".join(json.dumps(item) + ": true" for item in light_ids) + "}"
          light_anchor = "const MOBILE_LOCAL_BLOCK_LIGHTS := 12"
          if source.count(light_anchor) != 1:
              raise SystemExit("Potential light-source constant anchor missing")
          source = source.replace(light_anchor, light_anchor + "\n" + light_constant, 1)
          emission_line = "        var emission := _emission_for_block(cell, block_id)"
          if source.count(emission_line) != 1:
              raise SystemExit("Point-light emission line anchor missing")
          source = source.replace(
              emission_line,
              "        if not POTENTIAL_LIGHT_SOURCE_IDS.has(block_id):\n"
              "            continue\n"
              + emission_line,
              1,
          )
          source = source.replace("const BLOCK_LIGHT_SCAN_INTERVAL := 0.75", "const BLOCK_LIGHT_SCAN_INTERVAL := 1.5", 1)

          path.write_text(source)
          (project / "VERSION.txt").write_text("0.5.9\n")
          print(f"Fixed {changed} quad index sites and optimized repeated base-block/light-source work.")
          PY
      - name: Switch Android to OpenGL Compatibility and tune mobile rendering
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import re, sys

          project = Path(sys.argv[1])
          settings_path = project / "project.godot"
          settings = settings_path.read_text()

          # Godot issue #115217 and duplicate #123370 report these same screen-wide
          # horizontal pixel lines on Android Vulkan Mobile, including 4.7.2.
          # Use OpenGL ES Compatibility on Android to avoid that Vulkan render path.
          for key in ("renderer/rendering_method", "renderer/rendering_method.mobile"):
              pattern = re.compile(r"(?m)^" + re.escape(key) + r"\s*=.*$")
              line = key + '="gl_compatibility"'
              if pattern.search(settings):
                  settings = pattern.sub(line, settings, count=1)
              else:
                  section = "[rendering]"
                  if section not in settings:
                      settings += "\n[rendering]\n"
                  settings = settings.replace(section + "\n", section + "\n" + line + "\n", 1)
          settings_path.write_text(settings)
          (project / "VERSION.txt").write_text("0.6.5\n")

          # Fix an actual CPU hot path: get(key, _terrain_height_at(...)) eagerly
          # computes the terrain even when the surface-height dictionary has the key.
          world_path = project / "scripts/world.gd"
          world = world_path.read_text()
          old = "    var terrain_height := int(surface_heights.get(Vector2i(cell.x, cell.z), _terrain_height_at(cell.x, cell.z)))"
          new = """    var terrain_column := Vector2i(cell.x, cell.z)
              var terrain_height: int
              if surface_heights.has(terrain_column):
                  terrain_height = int(surface_heights[terrain_column])
              else:
                  terrain_height = _terrain_height_at(cell.x, cell.z)"""
          if world.count(old) == 1:
              world = world.replace(old, new, 1)
          old = "    var surface := int(surface_heights.get(column, _terrain_height_at(x, z)))"
          new = """    var surface: int
              if surface_heights.has(column):
                  surface = int(surface_heights[column])
              else:
                  surface = _terrain_height_at(x, z)"""
          if world.count(old) == 1:
              world = world.replace(old, new, 1)
          world_path.write_text(world)

          # Lightweight Minecraft-style HUD refinement: use symbols for the two primary
          # actions, soften the glass-like button fill, and center the health/hunger row
          # above the hotbar. All existing touch signals/feature callbacks are preserved.
          hud_path = project / "scripts/mobile_hud.gd"
          hud = hud_path.read_text()
          hud = hud.replace('_make_button("HIT", "BreakButton"', '_make_button("⛏", "BreakButton"', 1)
          hud = hud.replace('_make_button("USE", "PlaceButton"', '_make_button("▣", "PlaceButton"', 1)
          hud = hud.replace("Color(0.075, 0.09, 0.11, 0.55)", "Color(0.055, 0.065, 0.078, 0.38)", 1)
          hud = hud.replace("Color(0.84, 0.88, 0.9, 0.50)", "Color(0.86, 0.89, 0.92, 0.36)", 1)

          old_health = """health_label.anchor_left = 1.0
              health_label.anchor_right = 1.0
              health_label.anchor_top = 0.0
              health_label.anchor_bottom = 0.0
              health_label.offset_left = -290.0
              health_label.offset_right = -122.0
              health_label.offset_top = 34.0
              health_label.offset_bottom = 57.0
              health_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_RIGHT"""
          new_health = """health_label.anchor_left = 0.5
              health_label.anchor_right = 0.5
              health_label.anchor_top = 1.0
              health_label.anchor_bottom = 1.0
              health_label.offset_left = -175.0
              health_label.offset_right = 175.0
              health_label.offset_top = -88.0
              health_label.offset_bottom = -62.0
              health_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER"""
          if old_health in hud:
              hud = hud.replace(old_health, new_health, 1)
          old_layout = """health_label.offset_left = -290.0 * scale
                  health_label.offset_right = -122.0 * scale
                  health_label.offset_top = 33.0 * scale
                  health_label.offset_bottom = 56.0 * scale"""
          new_layout = """health_label.anchor_left = 0.5
                  health_label.anchor_right = 0.5
                  health_label.anchor_top = 1.0
                  health_label.anchor_bottom = 1.0
                  health_label.offset_left = -175.0 * scale
                  health_label.offset_right = 175.0 * scale
                  health_label.offset_top = -88.0 * scale
                  health_label.offset_bottom = -62.0 * scale
                  health_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER"""
          if old_layout in hud:
              hud = hud.replace(old_layout, new_layout, 1)
          hud_path.write_text(hud)

          final_settings = settings_path.read_text()
          if 'renderer/rendering_method="gl_compatibility"' not in final_settings:
              raise SystemExit("Primary Compatibility renderer setting missing")
          if 'renderer/rendering_method.mobile="gl_compatibility"' not in final_settings:
              raise SystemExit("Mobile Compatibility renderer setting missing")
          print("Renderer set to GL Compatibility; eager height defaults fixed; HUD actions styled.")
          PY
      - name: Fix chunk seams, leaf cutout striping, and mobile CPU spikes
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import json, random, re, subprocess, sys

          project = Path(sys.argv[1])
          world_path = project / "scripts/world.gd"
          world = world_path.read_text()

          # Neighbours beyond the loaded block dictionary must be resolved from the
          # deterministic base world inside the stream radius; treating them as air
          # made chunk edges emit duplicate coplanar faces (z-fighting/stretched streaks).
          helper_anchor = "func _base_cell_has_visible_face(cell: Vector3i, block_id: String) -> bool:"
          helper = """func _mesh_neighbour_block_id(cell: Vector3i) -> String:
              if cell.y < MIN_WORLD_Y or cell.y > MAX_WORLD_Y:
                  return "air"
              var key := _cell_key(cell)
              if modifications.has(key):
                  return str(modifications[key])
              if blocks.has(cell):
                  return str(blocks[cell])
              var coord := _chunk_for_cell(cell)
              if chunk_nodes.has(coord) or _within_radius(coord, streaming_center, _active_load_radius()):
                  return _base_block_at(cell)
              return "air"

          """
          if "func _mesh_neighbour_block_id(cell: Vector3i) -> String:" not in world:
              if world.count(helper_anchor) != 1:
                  raise SystemExit("Mesh-neighbour helper insertion point missing")
              world = world.replace(helper_anchor, helper + helper_anchor, 1)

          # Cache block metadata used repeatedly during generation.
          if "var _render_block_definition_cache: Dictionary = {}" not in world:
              anchor = "var _generation_base_cache_active := false"
              if world.count(anchor) != 1:
                  raise SystemExit("Render definition cache field marker missing")
              world = world.replace(anchor, anchor + "\nvar _render_block_definition_cache: Dictionary = {}", 1)
          if "func _cached_render_definition(block_id: String) -> Dictionary:" not in world:
              cached = """func _cached_render_definition(block_id: String) -> Dictionary:
              if not _render_block_definition_cache.has(block_id):
                  _render_block_definition_cache[block_id] = BlockRegistry.get_block(block_id)
              return _render_block_definition_cache[block_id]

          """
              if world.count(helper_anchor) != 1:
                  raise SystemExit("Cached render-definition helper marker missing")
              world = world.replace(helper_anchor, cached + helper_anchor, 1)
          visible_start = world.find(helper_anchor)
          visible_end = world.find("\nfunc _write_generated_block", visible_start)
          if visible_start < 0 or visible_end < 0:
              raise SystemExit("Visible-face function boundaries missing")
          visible = world[visible_start:visible_end]
          visible = visible.replace("var definition := BlockRegistry.get_block(block_id)", "var definition := _cached_render_definition(block_id)", 1)
          visible = visible.replace("var neighbour_def := BlockRegistry.get_block(neighbour_id)", "var neighbour_def := _cached_render_definition(neighbour_id)", 1)
          local_dirs = "    var directions: Array[Vector3i] = [Vector3i.RIGHT, Vector3i.LEFT, Vector3i.UP, Vector3i.DOWN, Vector3i.BACK, Vector3i.FORWARD]\n"
          visible = visible.replace(local_dirs, "", 1).replace("for direction in directions:", "for direction in DIRECTIONS:", 1)
          world = world[:visible_start] + visible + world[visible_end:]

          # Put each chunk node at its integer origin and store its mesh vertices relative
          # to that origin. This retains precision after long travel into large coordinates.
          chunk_root_line = '    chunk_root.name = "Chunk_%d_%d" % [coord.x, coord.y]'
          if chunk_root_line not in world:
              raise SystemExit("Chunk-root origin insertion marker missing")
          if "chunk_root.position = Vector3(float(coord.x * CHUNK_SIZE)" not in world:
              world = world.replace(chunk_root_line, chunk_root_line + '\n    chunk_root.position = Vector3(float(coord.x * CHUNK_SIZE), 0.0, float(coord.y * CHUNK_SIZE))', 1)

          mesh_start = world.find("func _rebuild_chunk_mesh(chunk_coord: Vector2i) -> void:")
          mesh_end = world.find("\nfunc _fluid_surface_height", mesh_start)
          if mesh_start < 0 or mesh_end < 0:
              raise SystemExit("Chunk mesh function boundaries missing")
          mesh = world[mesh_start:mesh_end]
          cube_neighbour = "var neighbour_id := get_block_id(neighbour)"
          if cube_neighbour in mesh:
              mesh = mesh.replace(cube_neighbour, "var neighbour_id := _mesh_neighbour_block_id(neighbour)", 1)
          elif "var neighbour_id := _mesh_neighbour_block_id(neighbour)" not in mesh:
              raise SystemExit("Cube face neighbour lookup missing")
          if "var chunk_mesh_origin := Vector3(" not in mesh:
              marker = "    if not was_generation_cache_active:"
              if mesh.count(marker) != 1:
                  raise SystemExit("Chunk-local vertex conversion marker missing")
              convert = (
                  "    var chunk_mesh_origin := Vector3(float(chunk_coord.x * CHUNK_SIZE), 0.0, float(chunk_coord.y * CHUNK_SIZE))\n"
                  "    for vertex_index in range(vertices.size()):\n"
                  "        vertices[vertex_index] = vertices[vertex_index] - chunk_mesh_origin\n"
                  "    for collision_index in range(collision_faces.size()):\n"
                  "        collision_faces[collision_index] = collision_faces[collision_index] - chunk_mesh_origin\n"
              )
              mesh = mesh.replace(marker, convert + marker, 1)
          world = world[:mesh_start] + mesh + world[mesh_end:]

          # Apply the same deterministic neighbour query to shaped blocks and fences.
          shape_start = world.find("func _append_shaped_block_geometry(")
          shape_end = world.find("\nfunc _fence_connects_to", shape_start)
          if shape_start < 0 or shape_end < 0:
              raise SystemExit("Shaped-block function boundaries missing")
          shaped = world[shape_start:shape_end]
          shaped = shaped.replace("neighbour_id = get_block_id(cell + DIRECTIONS[face_index])", "neighbour_id = _mesh_neighbour_block_id(cell + DIRECTIONS[face_index])", 1)
          shaped = shaped.replace("var neighbour_id := get_block_id(cell + DIRECTIONS[face_index])", "var neighbour_id := _mesh_neighbour_block_id(cell + DIRECTIONS[face_index])", 1)
          world = world[:shape_start] + shaped + world[shape_end:]
          fence_start = world.find("func _fence_connects_to(cell: Vector3i, direction: Vector3i) -> bool:")
          fence_end = world.find("\nfunc _box_face_is_internal", fence_start)
          if fence_start >= 0 and fence_end > fence_start:
              fence = world[fence_start:fence_end].replace("var neighbour_id := get_block_id(neighbour_cell)", "var neighbour_id := _mesh_neighbour_block_id(neighbour_cell)", 1)
              world = world[:fence_start] + fence + world[fence_end:]

          # Build a neighbour remesh queue. Loading one chunk no longer synchronously
          # rebuilds up to five expensive meshes in a single frame.
          if "var _stream_dirty_mesh_chunks: Dictionary = {}" not in world:
              anchor = "var _generation_base_cache_active := false"
              world = world.replace(anchor, anchor + "\nvar _stream_dirty_mesh_chunks: Dictionary = {}", 1)
          process_start = world.find("func _process(delta: float) -> void:")
          process_end = world.find("\nfunc generate_world", process_start)
          if process_start < 0 or process_end < 0:
              raise SystemExit("World process function boundaries missing")
          process = world[process_start:process_end]
          old_stream = "            _load_chunk(coord)\n            _refresh_chunk_and_neighbours(coord)\n            generated_this_frame += 1"
          new_stream = (
              "            _load_chunk(coord)\n"
              "            _rebuild_chunk_mesh(coord)\n"
              "            for offset in [Vector2i.LEFT, Vector2i.RIGHT, Vector2i.UP, Vector2i.DOWN]:\n"
              "                var dirty_coord: Vector2i = coord + offset\n"
              "                if chunk_nodes.has(dirty_coord):\n"
              "                    _stream_dirty_mesh_chunks[dirty_coord] = true\n"
              "            generated_this_frame += 1"
          )
          if old_stream in process:
              process = process.replace(old_stream, new_stream, 1)
          elif "_stream_dirty_mesh_chunks[dirty_coord] = true" not in process:
              raise SystemExit("Chunk-stream rebuild block missing")
          if "_stream_dirty_mesh_chunks.erase(dirty_chunk)" not in process:
              process = process.rstrip() + (
                  "\n\n    if not _stream_dirty_mesh_chunks.is_empty():\n"
                  "        var dirty_keys := _stream_dirty_mesh_chunks.keys()\n"
                  "        var dirty_chunk: Vector2i = dirty_keys[0]\n"
                  "        _stream_dirty_mesh_chunks.erase(dirty_chunk)\n"
                  "        if chunk_nodes.has(dirty_chunk):\n"
                  "            _rebuild_chunk_mesh(dirty_chunk)\n"
              )
          world = world[:process_start] + process + world[process_end:]

          # Tick transient block state at 10 Hz instead of deep-copying it at display FPS.
          if "var _transient_tick_accumulator := 0.0" not in world:
              anchor = "var _block_light_scan_accumulator := 0.0"
              if world.count(anchor) != 1:
                  raise SystemExit("Transient tick accumulator field marker missing")
              world = world.replace(anchor, anchor + "\nvar _transient_tick_accumulator := 0.0", 1)
          if "_tick_transient_states(delta)" in world:
              world = world.replace(
                  "    _tick_transient_states(delta)",
                  "    _transient_tick_accumulator += delta\n"
                  "    if _transient_tick_accumulator >= 0.1:\n"
                  "        var transient_delta := _transient_tick_accumulator\n"
                  "        _transient_tick_accumulator = 0.0\n"
                  "        _tick_transient_states(transient_delta)",
                  1,
              )

          # Keep the noisy biome query off the many underground voxel lookups.
          base_start = world.find("func _base_block_at_uncached(cell: Vector3i) -> String:")
          base_end = world.find("\nfunc _nether_block_at", base_start)
          if base_start < 0:
              raise SystemExit("Base-world function missing")
          if base_end < 0:
              base_end = world.find("\nfunc ", base_start + 1)
          base_fn = world[base_start:base_end]
          old_biome = "    var biome := get_biome_at(cell.x, cell.z)\n    if cell.y > terrain_height:"
          if old_biome in base_fn:
              base_fn = base_fn.replace(old_biome, "    if cell.y > terrain_height:", 1)
              surface_marker = "    if cell.y < terrain_height - 1:"
              if surface_marker not in base_fn:
                  raise SystemExit("Biome query relocation point missing")
              base_fn = base_fn.replace(surface_marker, "    var biome := get_biome_at(cell.x, cell.z)\n" + surface_marker, 1)
              world = world[:base_start] + base_fn + world[base_end:]

          cave_calls = [
              ("if _is_cave_cell(cell):", "if _is_cave_cell(cell, terrain_height):"),
              ("if cell.y < floor_height - 4 and _is_cave_cell(cell):", "if cell.y < floor_height - 4 and _is_cave_cell(cell, floor_height):"),
              ("if cell.y < surface - 4 and _is_cave_cell(cell):", "if cell.y < surface - 4 and _is_cave_cell(cell, surface):"),
              ("func _is_cave_cell(cell: Vector3i) -> bool:", "func _is_cave_cell(cell: Vector3i, terrain_height: int) -> bool:"),
              ("if cell.y < MIN_WORLD_Y + 6 or cell.y > _terrain_height_at(cell.x, cell.z) - 5:", "if cell.y < MIN_WORLD_Y + 6 or cell.y > terrain_height - 5:"),
          ]
          for old, new in cave_calls:
              if old in world:
                  world = world.replace(old, new, 1)
          if "func _is_cave_cell(cell: Vector3i, terrain_height: int) -> bool:" not in world:
              raise SystemExit("Height-parameterized cave test missing")

          world_path.write_text(world)

          # Repair the atlas leaf cutout masks. The original alpha-zero pixels clustered
          # in the top/bottom texel rows, so repeating them per voxel created horizontal
          # transparent streaks across canopies. Keep the alpha count but scatter holes
          # into the interior and leave every tile edge opaque.
          from PIL import Image
          atlas_path = project / "assets/textures/atlas.png"
          atlas_map_path = project / "assets/textures/atlas_map.json"
          atlas = Image.open(atlas_path).convert("RGBA")
          atlas_map = json.loads(atlas_map_path.read_text())
          leaf_ids = [block_id for block_id in atlas_map["tiles"] if "leaves" in block_id]
          if not leaf_ids:
              raise SystemExit("No leaves tile entries in atlas map")
          moved = 0
          for block_id in leaf_ids:
              for face, slot in atlas_map["tiles"][block_id].items():
                  x0, y0 = int(slot["x"]), int(slot["y"])
                  tile = atlas.crop((x0, y0, x0 + 16, y0 + 16))
                  data = list(tile.getdata())
                  holes = sum(1 for pixel in data if pixel[3] == 0)
                  if holes == 0:
                      continue
                  seed = sum((i + 1) * ord(ch) for i, ch in enumerate(block_id + "/" + face))
                  candidates = [(x, y) for y in range(1, 15) for x in range(1, 15)]
                  random.Random(seed).shuffle(candidates)
                  selected = []
                  for x, y in candidates:
                      if all(abs(x - ax) + abs(y - ay) > 1 for ax, ay in selected):
                          selected.append((x, y))
                          if len(selected) == holes:
                              break
                  if len(selected) != holes:
                      raise SystemExit(f"Could not distribute leaf holes for {block_id}/{face}")
                  for i, pixel in enumerate(data):
                      if pixel[3] == 0:
                          data[i] = (pixel[0], pixel[1], pixel[2], 255)
                  for x, y in selected:
                      i = y * 16 + x
                      data[i] = (data[i][0], data[i][1], data[i][2], 0)
                  tile.putdata(data)
                  atlas.paste(tile, (x0, y0))
                  moved += holes
                  border = list(range(16)) + list(range(240, 256)) + [y * 16 for y in range(16)] + [y * 16 + 15 for y in range(16)]
                  if any(tile.getpixel((i % 16, i // 16))[3] == 0 for i in border):
                      raise SystemExit(f"Leaf edge still has transparent pixels: {block_id}/{face}")
          atlas.save(atlas_path)
          subprocess.run([sys.executable, str(project / "tools/rebuild_block_textures_from_atlas.py")], check=True, stdout=subprocess.PIPE, text=True)

          # New worlds default to daytime for a useful visual test; saved worlds keep their time.
          main_path = project / "scripts/main.gd"
          main = main_path.read_text()
          main = main.replace('saved.get("day_time", 1000.0)', 'saved.get("day_time", 6000.0)', 1)
          main_path.write_text(main)

          # Improve mobile controls with labeled tap targets and a Bedrock-like button
          # surface; the sprint setter no longer rebuilds theme resources every frame.
          hud_path = project / "scripts/mobile_hud.gd"
          hud = hud_path.read_text()
          hud = hud.replace('_make_button("⛏", "BreakButton"', '_make_button("BREAK", "BreakButton"', 1)
          hud = hud.replace('_make_button("HIT", "BreakButton"', '_make_button("BREAK", "BreakButton"', 1)
          hud = hud.replace('_make_button("▣", "PlaceButton"', '_make_button("PLACE", "PlaceButton"', 1)
          hud = hud.replace('_make_button("USE", "PlaceButton"', '_make_button("PLACE", "PlaceButton"', 1)
          hud = hud.replace('_make_button("↑", "JumpButton"', '_make_button("JUMP", "JumpButton"', 1)
          hud = hud.replace('_make_button("⌄", "DescendButton"', '_make_button("DOWN", "DescendButton"', 1)
          hud = hud.replace('_make_button("»", "SprintButton"', '_make_button("RUN", "SprintButton"', 1)
          hud = hud.replace("Color(0.055, 0.065, 0.078, 0.38)", "Color(0.28, 0.30, 0.30, 0.52)", 1)
          hud = hud.replace("Color(0.86, 0.89, 0.92, 0.36)", "Color(0.03, 0.04, 0.04, 0.94)", 1)
          if "normal.shadow_size = 2" not in hud:
              anchor = "    normal.content_margin_bottom = 2.0"
              if anchor in hud:
                  hud = hud.replace(anchor, anchor + "\n    normal.shadow_color = Color(0.0, 0.0, 0.0, 0.55)\n    normal.shadow_size = 2\n    normal.shadow_offset = Vector2(0, 2)", 1)
          if "var _sprint_style_enabled := false" not in hud:
              state_anchor = "var _sprint_enabled := false"
              if state_anchor not in hud:
                  raise SystemExit("Sprint style variable marker missing")
              hud = hud.replace(state_anchor, state_anchor + "\nvar _sprint_style_enabled := false", 1)

          def replace_function(source, signature, body):
              start = source.find(signature)
              if start < 0:
                  raise SystemExit("HUD function missing: " + signature)
              end = source.find("\nfunc ", start + len(signature))
              if end < 0:
                  raise SystemExit("No next function boundary after: " + signature)
              return source[:start] + body.rstrip() + "\n\n" + source[end + 1:]

          sprint_body = """func set_sprint_text(enabled: bool) -> void:
              _sprint_enabled = enabled
              var sprint_btn := root.get_node_or_null("SprintButton") as Button
              if sprint_btn == null or _sprint_style_enabled == enabled:
                  return
              _sprint_style_enabled = enabled
              sprint_btn.text = "RUN ON" if enabled else "RUN"
              sprint_btn.tooltip_text = "Toggle sprint"
              sprint_btn.modulate = Color.WHITE
              _apply_mobile_button_style(sprint_btn, enabled, true)
          """
          hud = replace_function(hud, "func set_sprint_text(enabled: bool) -> void:", sprint_body)
          health_body = """func set_health(health: int, hunger: int) -> void:
              if health_label == null:
                  return
              var hearts := ""
              var food := ""
              for i in range(10):
                  hearts += "♥" if health - i * 2 >= 2 else "♡"
                  food += "◆" if hunger - i * 2 >= 2 else "◇"
              health_label.text = hearts + "   " + food
          """
          hud = replace_function(hud, "func set_health(health: int, hunger: int) -> void:", health_body)
          hud_path.write_text(hud)

          # Record the matching app version and Android versionCode.
          project_settings = project / "project.godot"
          settings = project_settings.read_text()
          settings = re.sub(r'(?m)^config/version=.*
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"

      - name: Install Python texture-generation dependency
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore deterministic texture files in the build workspace
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python "$PROJECT_DIR/tools/rebuild_block_textures_from_atlas.py"

      - name: Download Godot 4.7.2 and matching Android export templates
        run: |
          set -euo pipefail
          curl --fail --location --show-error             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"             --output "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --show-error             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"             --output "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/templates"
          if [ -d "$RUNNER_TEMP/templates/templates" ]; then
            cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          else
            cp -a "$RUNNER_TEMP/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          fi
          printf '4.7.2.stable' > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          "$GODOT_BIN" --version

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and export Android debug APK
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-import.log"; then
            echo "GDScript errors found during import; refusing to publish a broken APK."
            exit 1
          fi
          echo "Running a headless main-scene startup smoke test..."
          timeout 120s "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 3 2>&1 | tee "$RUNNER_TEMP/godot-runtime.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "Runtime startup errors detected; refusing to publish this APK."
            exit 1
          fi
          if ! grep -q "Flatworld startup: touch HUD created" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "The main scene did not finish creating the player and touch HUD."
            exit 1
          fi
          if ! grep -q "Flatworld spawn invariant:" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "Spawn surface invariant was not logged."
            exit 1
          fi
          # Use a real window and software OpenGL to test a rendered frame, not only startup.
          mkdir -p "$RUNNER_TEMP/visual" "$GITHUB_WORKSPACE/visual-artifacts"
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb ffmpeg
          fi
          timeout 120s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN" --path "$PROJECT_DIR" --write-movie "$RUNNER_TEMP/visual/compatibility-smoke.avi" --fixed-fps 10 --resolution 1280x720 --quit-after 50 2>&1 | tee "$RUNNER_TEMP/godot-visual.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" "$RUNNER_TEMP/godot-visual.log"; then
            echo "Graphical Compatibility startup reported engine/script errors."
            exit 1
          fi
          if ! grep -Eqi "OpenGL API|OpenGL ES" "$RUNNER_TEMP/godot-visual.log"; then
            echo "Graphical smoke test did not initialize OpenGL/Compatibility."
            exit 1
          fi
          test -s "$RUNNER_TEMP/visual/compatibility-smoke.avi"
          ffmpeg -y -loglevel error -ss 3 -i "$RUNNER_TEMP/visual/compatibility-smoke.avi" -frames:v 1 "$RUNNER_TEMP/visual/compatibility-smoke.png"
          python3 - "$RUNNER_TEMP/visual/compatibility-smoke.png" <<'PY'
          from PIL import Image, ImageStat
          import sys
          image = Image.open(sys.argv[1]).convert("RGB")
          stats = ImageStat.Stat(image)
          mean = sum(stats.mean) / 3.0
          spread = sum(stats.stddev) / 3.0
          non_dark = sum(1 for r, g, b in image.getdata() if max(r, g, b) > 24) / (image.width * image.height)
          print(f"Rendered frame stats: mean_rgb={mean:.1f}; spread={spread:.1f}; non_dark={non_dark:.1%}")
          if mean < 18 or spread < 8 or non_dark < 0.10:
              raise SystemExit("Rendered game frame is blank/near-black; refusing to publish APK.")
          PY
          cp "$RUNNER_TEMP/visual/compatibility-smoke.png" "$GITHUB_WORKSPACE/visual-artifacts/compatibility-smoke.png"
          cp "$RUNNER_TEMP/godot-visual.log" "$GITHUB_WORKSPACE/visual-artifacts/godot-visual.log"
          echo "Headless startup smoke test passed."
          mkdir -p "$PROJECT_DIR/build"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/Flatworld-Creative-0.6.5.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-export.log"; then
            echo "GDScript errors found during export; refusing to publish a broken APK."
            exit 1
          fi
          test -s "$PROJECT_DIR/build/Flatworld-Creative-0.6.5.apk"
          ls -lh "$PROJECT_DIR/build/Flatworld-Creative-0.6.5.apk"
          python3 - "$PROJECT_DIR" "$GITHUB_WORKSPACE/Flatworld-Creative-0.6.5-Source.zip" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import sys
          project = Path(sys.argv[1])
          output = Path(sys.argv[2])
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for path in project.rglob("*"):
                  if path.is_file() and ".godot" not in path.parts and "build" not in path.parts:
                      archive.write(path, Path(project.name) / path.relative_to(project))
          print(f"Matching source package created: {output.stat().st_size} bytes")
          PY

