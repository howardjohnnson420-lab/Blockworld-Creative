          fi
          if ! grep -q "Flatworld startup: touch HUD created" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "The main scene did not finish creating the player and touch HUD."
            exit 1
          fi
          if ! grep -q "Flatworld spawn invariant:" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "Spawn surface invariant was not logged."
            exit 1
          fi
          # Use a real window and software OpenGL to test a rendered frame, not only startup.
          mkdir -p "$RUNNER_TEMP/visual" "$GITHUB_WORKSPACE/visual-artifacts"
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb ffmpeg
          fi
          timeout 120s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 "$GODOT_BIN" --path "$PROJECT_DIR" --write-movie "$RUNNER_TEMP/visual/compatibility-smoke.avi" --fixed-fps 10 --resolution 1280x720 --quit-after 50 2>&1 | tee "$RUNNER_TEMP/godot-visual.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" "$RUNNER_TEMP/godot-visual.log"; then
            echo "Graphical Compatibility startup reported engine/script errors."
            exit 1
          fi
          if ! grep -Eqi "OpenGL API|OpenGL ES" "$RUNNER_TEMP/godot-visual.log"; then
            echo "Graphical smoke test did not initialize OpenGL/Compatibility."
            exit 1
          fi
          test -s "$RUNNER_TEMP/visual/compatibility-smoke.avi"
          ffmpeg -y -loglevel error -ss 3 -i "$RUNNER_TEMP/visual/compatibility-smoke.avi" -frames:v 1 "$RUNNER_TEMP/visual/compatibility-smoke.png"
          python3 - "$RUNNER_TEMP/visual/compatibility-smoke.png" <<'PY'
          from PIL import Image, ImageStat
          import sys
          image = Image.open(sys.argv[1]).convert("RGB")
          stats = ImageStat.Stat(image)
          mean = sum(stats.mean) / 3.0
          spread = sum(stats.stddev) / 3.0
          non_dark = sum(1 for r, g, b in image.getdata() if max(r, g, b) > 24) / (image.width * image.height)
          print(f"Rendered frame stats: mean_rgb={mean:.1f}; spread={spread:.1f}; non_dark={non_dark:.1%}")
          if mean < 18 or spread < 8 or non_dark < 0.10:
              raise SystemExit("Rendered game frame is blank/near-black; refusing to publish APK.")
          PY
          cp "$RUNNER_TEMP/visual/compatibility-smoke.png" "$GITHUB_WORKSPACE/visual-artifacts/compatibility-smoke.png"
          cp "$RUNNER_TEMP/godot-visual.log" "$GITHUB_WORKSPACE/visual-artifacts/godot-visual.log"
          echo "Headless startup smoke test passed."
          mkdir -p "$PROJECT_DIR/build"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/Flatworld-Creative-0.6.5.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-export.log"; then
            echo "GDScript errors found during export; refusing to publish a broken APK."
            exit 1
          fi
          test -s "$PROJECT_DIR/build/Flatworld-Creative-0.6.5.apk"
          ls -lh "$PROJECT_DIR/build/Flatworld-Creative-0.6.5.apk"
          python3 - "$PROJECT_DIR" "$GITHUB_WORKSPACE/Flatworld-Creative-0.6.5-Source.zip" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import sys
          project = Path(sys.argv[1])
          output = Path(sys.argv[2])
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=6) as archive:
              for path in project.rglob("*"):
                  if path.is_file() and ".godot" not in path.parts and "build" not in path.parts:
                      archive.write(path, Path(project.name) / path.relative_to(project))
          print(f"Matching source package created: {output.stat().st_size} bytes")
          PY

