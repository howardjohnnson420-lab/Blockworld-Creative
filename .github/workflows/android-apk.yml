name: One-time Android APK export

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-apk:
    name: Export Godot 4.7.2 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Fetch the exact uploaded project ZIP
        env:
          PROJECT_ZIP_URL: "https://uc775bf25428754dc69bab1767ca.dl.dropboxusercontent.com/cd/0/get/DKE6IYyGL-hF46lz2ZlZ4PidDZMCU7otC1XhxgTKzgmtAMgaakNMqbPZBToE-HzHxlU_LZ7vVFKsthOJHkK5E8fvTnBgozBNqqdKDjcujpBZeWdYJJR61sh3H-yl04Qy1YIqrLhj0NktAo0yGRjV2C1MC6MAAiqz55Nw92S9whDhog/file?c_luid=281c495f"
        run: |
          set -euo pipefail
          curl --fail --location --show-error "$PROJECT_ZIP_URL" --output "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" -d "$GITHUB_WORKSPACE/source"
          PROJECT_DIR="$GITHUB_WORKSPACE/source/Flatworld_Creative_Godot"
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          # Apply the Android-required texture import option only to this temporary build copy.
          python3 - "$PROJECT_DIR/project.godot" <<'PY'
          from pathlib import Path
          import sys
          project_file = Path(sys.argv[1])
          project_text = project_file.read_text()
          key = "textures/vram_compression/import_etc2_astc"
          lines = project_text.splitlines()
          found = False
          for index, line in enumerate(lines):
              if line.startswith(key + "="):
                  lines[index] = key + "=true"
                  found = True
                  break
          if not found:
              for index, line in enumerate(lines):
                  if line.strip() == "[rendering]":
                      lines.insert(index + 1, key + "=true")
                      found = True
                      break
          if not found:
              raise SystemExit("No [rendering] section in project.godot")
          project_file.write_text("\n".join(lines) + "\n")
          PY
          python3 - "$PROJECT_DIR/scripts/main.gd" <<'PY'
          from pathlib import Path
          import sys
          script = Path(sys.argv[1])
          lines = script.read_text().splitlines()
          if not any(line.startswith("func _cell_from_key(") for line in lines):
              for index, line in enumerate(lines):
                  if line.startswith("func _cell_key(cell: Vector3i)"):
                      addition = [
                          "",
                          "func _cell_from_key(cell_key: String) -> Vector3i:",
                          '    var parts := cell_key.split(",")',
                          "    if parts.size() != 3:",
                          "        return Vector3i.ZERO",
                          "    return Vector3i(int(parts[0]), int(parts[1]), int(parts[2]))",
                      ]
                      lines[index + 2:index + 2] = addition
                      break
              else:
                  raise SystemExit("Could not find _cell_key insertion point in scripts/main.gd")
              script.write_text("\n".join(lines) + "\n")
          PY
          python3 - "$PROJECT_DIR/scripts/world.gd" "$PROJECT_DIR/scripts/mobile_hud.gd" <<'PY'
          from pathlib import Path
          import sys
          world = Path(sys.argv[1])
          lines = world.read_text().splitlines()
          for i, line in enumerate(lines):
              if line.startswith("func _base_cell_has_visible_face("):
                  j = i + 1
                  while j < len(lines) and lines[j] != "    return false":
                      j += 1
                  orphan = [
                      "    _generate_chunk_vegetation(coord)",
                      "    _generate_camp_piece_for_chunk(coord)",
                      "    _apply_chunk_modifications(coord)",
                      "    _generated_chunk_count += 1",
                  ]
                  if lines[j + 1:j + 1 + len(orphan)] == orphan:
                      del lines[j + 1:j + 1 + len(orphan)]
                  break
          replacements = {
              '    var leaves_id := ["red_poplar_leaves", "orange_poplar_leaves", "yellow_poplar_leaves"][rng.randi_range(0, 2)]': '    var leaves_id: String = ["red_poplar_leaves", "orange_poplar_leaves", "yellow_poplar_leaves"][rng.randi_range(0, 2)]',
              '            var target := cell + direction': '            var target: Vector3i = cell + direction',
              '                var neighbour := cell + direction': '                var neighbour: Vector3i = cell + direction',
              '        var affected := coord + offset': '        var affected: Vector2i = coord + offset',
              '            var face_shade := [0.82, 0.82, 1.0, 0.58, 0.74, 0.74][face_index]': '            var face_shade: float = [0.82, 0.82, 1.0, 0.58, 0.74, 0.74][face_index]',
              '                var face_shade := [0.82, 0.82, 1.0, 0.58, 0.74, 0.74][face_index]': '                var face_shade: float = [0.82, 0.82, 1.0, 0.58, 0.74, 0.74][face_index]',
              '    var other_axes: Array[int] = [1, 2] if axis == 0 else ([0, 2] if axis == 1 else [0, 1])': '    var other_axes: Array = [1, 2] if axis == 0 else ([0, 2] if axis == 1 else [0, 1])',
              '                normals.append(normal)': '                normals.append(normal)\n                colors.append(Color(1.0, 1.0, 1.0, 1.0))',
          }
          lines = [replacements.get(line, line) for line in lines]
          # Keep only the spawn chunk synchronous at startup. Adjacent chunks stream in afterward.
          for func_name in ("func generate_world(", "func prepare_position("):
              start = next(i for i, line in enumerate(lines) if line.startswith(func_name))
              end = next((j for j in range(start + 1, len(lines)) if lines[j].startswith("func ")), len(lines))
              for j in range(start, end):
                  if lines[j].strip() == "for radius in range(0, 2):":
                      lines[j] = lines[j].replace("range(0, 2)", "range(0, 1)")
                      break
              else:
                  raise SystemExit("Could not find startup chunk loop in " + func_name)
          world.write_text("\n".join(lines) + "\n")
          hud = Path(sys.argv[2])
          hud_source = hud.read_text().replace("class VirtualJoystick extends Control:", "class MobileVirtualJoystick extends Control:").replace("VirtualJoystick.new()", "MobileVirtualJoystick.new()").replace("BlockRegistry.get_name(", "BlockRegistry.get_display_name(").replace("        button.icon_max_width = 18\n", "").replace("        item_btn.icon_max_width = 20\n", "")
          hud.write_text(hud_source)
          registry_path = world.parent / "block_registry.gd"
          registry_source = registry_path.read_text()
          if "static func get_name(item_or_block_id: String)" not in registry_source:
              raise SystemExit("Missing BlockRegistry.get_name rename target")
          registry_path.write_text(registry_source.replace("static func get_name(item_or_block_id: String)", "static func get_display_name(item_or_block_id: String)", 1))
          PY
          python3 - "$PROJECT_DIR/scripts/main.gd" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text().replace("BlockRegistry.get_name(", "BlockRegistry.get_display_name(")
          replacements = {
              "func _ready() -> void:\n    BlockRegistry.load_data()\n": "func _ready() -> void:\n    print(\"Flatworld startup: entering Main._ready\")\n    BlockRegistry.load_data()\n    print(\"Flatworld startup: registries loaded\")\n",
              "    pending_smelt = saved.get(\"pending_smelt\", []) if saved.get(\"pending_smelt\", []) is Array else []\n": "    var saved_pending_smelt: Variant = saved.get(\"pending_smelt\", [])\n    pending_smelt.clear()\n    if saved_pending_smelt is Array:\n        for pending_entry in saved_pending_smelt:\n            if pending_entry is Dictionary:\n                pending_smelt.append(pending_entry)\n",
              "    _create_environment()\n": "    _create_environment()\n    print(\"Flatworld startup: environment created\")\n",
              "    world.generate_world(world_seed, initial_dimension)\n": "    print(\"Flatworld startup: generating spawn chunk\")\n    world.generate_world(world_seed, initial_dimension)\n    print(\"Flatworld startup: spawn chunk generated\")\n",
              "    add_child(player)\n    player.spawn_position": "    add_child(player)\n    print(\"Flatworld startup: player camera created\")\n    player.spawn_position",
              "    add_child(hud)\n    hud.break_hold_changed": "    add_child(hud)\n    print(\"Flatworld startup: touch HUD created\")\n    hud.break_hold_changed",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit("Missing startup instrumentation marker: " + old.splitlines()[0])
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix mobile spawn, rendering, chunk cost, and touch controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR" <<'PY'
          from pathlib import Path
          import sys

          project = Path(sys.argv[1])

          def replace_func(source: str, name: str, next_name: str, body: str) -> str:
              start = source.find(name)
              if start < 0:
                  raise SystemExit("Missing function: " + name)
              end = source.find(next_name, start + len(name))
              if end < 0:
                  raise SystemExit("Missing next function marker: " + next_name)
              return source[:start] + body.rstrip() + "\n\n" + source[end:]

          # ----- Voxel world: spawn above the terrain, not under the sea -----
          world_path = project / "scripts/world.gd"
          world = world_path.read_text()
          world = world.replace(
              "const LOAD_RADIUS := 2 # Keep the resident mesh/collision budget appropriate for mobile.",
              "const LOAD_RADIUS := 2 # Desktop radius; mobile uses a smaller resident-chunk budget."
          )
          if "const MOBILE_LOCAL_BLOCK_LIGHTS :=" not in world:
              world = world.replace("const MAX_LOCAL_BLOCK_LIGHTS := 36",
                                    "const MAX_LOCAL_BLOCK_LIGHTS := 36\nconst MOBILE_LOCAL_BLOCK_LIGHTS := 12")
          world = world.replace(
              "        atlas_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA\n",
              "        # The shared atlas has cutout plant/leaf pixels and opaque terrain. Alpha blending\n"
              "        # disables depth writes for all opaque faces, causing severe mobile overdraw,\n"
              "        # black strips, and back-face sorting artefacts. Use cutout depth writing.\n"
              "        atlas_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA_SCISSOR\n"
              "        atlas_material.alpha_scissor_threshold = 0.42\n"
          )
          world = world.replace(
              "    var wanted_count := mini(MAX_LOCAL_BLOCK_LIGHTS, candidates.size())",
              "    var light_budget := MOBILE_LOCAL_BLOCK_LIGHTS if OS.has_feature(\"mobile\") else MAX_LOCAL_BLOCK_LIGHTS\n"
              "    var wanted_count := mini(light_budget, candidates.size())"
          )
          world = world.replace("LOAD_RADIUS + UNLOAD_MARGIN", "_active_load_radius() + _active_unload_margin()")
          world = world.replace("for radius in range(0, LOAD_RADIUS + 1):", "for radius in range(0, _active_load_radius() + 1):")
          if "func _active_load_radius() -> int:" not in world:
              anchor = "func _within_load_radius(coord: Vector2i, center: Vector2i) -> bool:\n"
              helpers = (
                  "func _active_load_radius() -> int:\n"
                  "    # Keep nine chunks resident on mobile; desktop still gets the full 5x5 view.\n"
                  "    return 1 if OS.has_feature(\"mobile\") else LOAD_RADIUS\n\n"
                  "func _active_unload_margin() -> int:\n"
                  "    return 1 if OS.has_feature(\"mobile\") else UNLOAD_MARGIN\n\n"
              )
              if anchor not in world: raise SystemExit("Mobile chunk radius insertion point missing")
              world = world.replace(anchor, helpers + anchor, 1)
          # Stream destination chunks without rebuilding every already-resident chunk.
          prep_start = world.find("func prepare_position(world_position: Vector3) -> void:")
          prep_end = world.find("\nfunc update_streaming", prep_start)
          if prep_start < 0 or prep_end < 0: raise SystemExit("prepare_position markers missing")
          prepare = """func prepare_position(world_position: Vector3) -> void:
              var center := Vector2i(floori(world_position.x / float(CHUNK_SIZE)), floori(world_position.z / float(CHUNK_SIZE)))
              streaming_center = center
              stream_queue.clear()
              _queued_coords.clear()
              var unload_coords: Array[Vector2i] = []
              for raw_coord in chunk_nodes.keys():
                  var coord: Vector2i = raw_coord
                  if not _within_radius(coord, center, _active_load_radius() + _active_unload_margin()):
                      unload_coords.append(coord)
              for coord in unload_coords:
                  _unload_chunk(coord)
              # Only the destination chunk must be synchronous for safe physics.
              # Existing chunks already have meshes, so do not rebuild the entire resident window.
              if not chunk_nodes.has(center):
                  _load_chunk(center)
                  _refresh_chunk_and_neighbours(center)
              _queue_chunks_around(center)
          """
          world = world[:prep_start] + prepare.rstrip() + world[prep_end:]
          # Materialize outer-edge block columns so the edge of the resident view has no holes.
          vis_start = world.find("func _base_cell_has_visible_face(cell: Vector3i, block_id: String) -> bool:")
          vis_end = world.find("\nfunc _write_generated_block", vis_start)
          if vis_start < 0 or vis_end < 0: raise SystemExit("visible-face function markers missing")
          visible = """func _base_cell_has_visible_face(cell: Vector3i, block_id: String) -> bool:
              var definition := BlockRegistry.get_block(block_id)
              var current_transparent := bool(definition.get("transparent", false))
              var directions: Array[Vector3i] = [Vector3i.RIGHT, Vector3i.LEFT, Vector3i.UP, Vector3i.DOWN, Vector3i.BACK, Vector3i.FORWARD]
              var current_chunk := _chunk_for_cell(cell)
              for direction in directions:
                  var neighbour_cell := cell + direction
                  var neighbour_chunk := _chunk_for_cell(neighbour_cell)
                  if neighbour_chunk != current_chunk and not chunk_nodes.has(neighbour_chunk):
                      # Keep the outer cutaway wall visible until the next chunk streams in.
                      return true
                  var neighbour_id := str(modifications.get(_cell_key(neighbour_cell), _base_block_at(neighbour_cell)))
                  if blocks.has(neighbour_cell) and not modifications.has(_cell_key(neighbour_cell)):
                      neighbour_id = str(blocks[neighbour_cell])
                  if neighbour_id == "air":
                      return true
                  var neighbour_def := BlockRegistry.get_block(neighbour_id)
                  var neighbour_transparent := bool(neighbour_def.get("transparent", false))
                  var neighbour_solid := bool(neighbour_def.get("solid", false))
                  if neighbour_id != block_id and (current_transparent or neighbour_transparent or not neighbour_solid):
                      return true
              return false
          """
          world = world[:vis_start] + visible.rstrip() + world[vis_end:]
          # Wider search: low-frequency Plains noise can keep a 15-block radius underwater.
          spawn_start = world.find("func get_spawn_position() -> Vector3:")
          spawn_end = world.find("\nfunc grow_poplar_sapling", spawn_start)
          if spawn_start < 0 or spawn_end < 0: raise SystemExit("spawn function markers missing")
          spawn = """func get_spawn_position() -> Vector3:
              if dimension_id == "nether":
                  return Vector3(0.5, float(_nether_height_at(0, 0)) + 1.05, 0.5)
              if dimension_id == "end":
                  return Vector3(0.5, float(_terrain_height_at(0, 0)) + 1.05, 0.5)
              # The terrain noise has a long wavelength, so search far enough to find dry land.
              var search_radius := CHUNK_SIZE * 8
              for radius in range(0, search_radius + 1):
                  for x in range(-radius, radius + 1):
                      for z in range(-radius, radius + 1):
                          if maxi(absi(x), absi(z)) != radius:
                              continue
                          var ground_y := int(surface_heights.get(Vector2i(x, z), _terrain_height_at(x, z)))
                          if ground_y < SEA_LEVEL + 1:
                              continue
                          var ground_id := _base_block_at(Vector3i(x, ground_y, z))
                          if not BlockRegistry.is_solid(ground_id):
                              continue
                          var head_one := _base_block_at(Vector3i(x, ground_y + 1, z))
                          var head_two := _base_block_at(Vector3i(x, ground_y + 2, z))
                          if (head_one == "air" or not BlockRegistry.is_solid(head_one)) and (head_two == "air" or not BlockRegistry.is_solid(head_two)):
                              return Vector3(float(x) + 0.5, float(ground_y) + 1.05, float(z) + 0.5)
              # Defensive fallback for unusual seeds: choose the highest nearby column.
              var best_x := 0
              var best_z := 0
              var best_y := MIN_WORLD_Y
              for x in range(-search_radius, search_radius + 1, 4):
                  for z in range(-search_radius, search_radius + 1, 4):
                      var y := int(_terrain_height_at(x, z))
                      if y > best_y:
                          best_y = y
                          best_x = x
                          best_z = z
              if best_y < SEA_LEVEL + 1:
                  return Vector3(float(best_x) + 0.5, float(SEA_LEVEL) + 1.05, float(best_z) + 0.5)
              return Vector3(float(best_x) + 0.5, float(best_y) + 1.05, float(best_z) + 0.5)
          """
          world = world[:spawn_start] + spawn.rstrip() + world[spawn_end:]
          world_path.write_text(world)

          # ----- Main scene: rescue invalid saved positions and trim mobile shadows -----
          main_path = project / "scripts/main.gd"
          main = main_path.read_text()
          main = main.replace(
              "    world.prepare_position(player.global_position)\n    player.health_changed.connect",
              "    world.prepare_position(player.global_position)\n"
              "    # Recover pre-fix saves that put the player inside solid terrain.\n"
              "    var invalid_spawn := false\n"
              "    var px := floori(player.global_position.x)\n"
              "    var pz := floori(player.global_position.z)\n"
              "    for py in range(floori(player.global_position.y), floori(player.global_position.y + 1.75) + 1):\n"
              "        if BlockRegistry.is_solid(world.get_block_id(Vector3i(px, py, pz))):\n"
              "            invalid_spawn = true\n"
              "            break\n"
              "    if invalid_spawn:\n"
              "        player.global_position = world.get_spawn_position()\n"
              "        player.spawn_position = player.global_position\n"
              "        player.velocity = Vector3.ZERO\n"
              "        world.prepare_position(player.global_position)\n"
              "    player.health_changed.connect", 1)
          main = main.replace("    sun.shadow_enabled = true\n    sun.directional_shadow_max_distance = 120.0",
              "    # Full-scene directional shadows are expensive on phones; desktop retains them.\n"
              "    sun.shadow_enabled = not OS.has_feature(\"mobile\")\n"
              "    sun.directional_shadow_max_distance = 72.0 if not OS.has_feature(\"mobile\") else 32.0")
          main_path.write_text(main)

          player_path = project / "scripts/player_controller.gd"
          player = player_path.read_text().replace("camera_node.fov = 75.0", "camera_node.fov = 70.0")
          player_path.write_text(player)

          # ----- HUD: Minecraft-inspired mobile layout, existing actions moved into pause menu -----
          hud_path = project / "scripts/mobile_hud.gd"
          hud = hud_path.read_text()
          hud = hud.replace("var _station_title: Label\n", "var _station_title: Label\nvar pause_panel: PanelContainer\n", 1)

          make_button = """func _make_button(text_value: String, node_name: String, parent: Control, width: float, height: float, font_size: int = 16) -> Button:
              var button := Button.new()
              button.texture_filter = CanvasItem.TEXTURE_FILTER_NEAREST
              button.name = node_name
              button.text = text_value
              button.custom_minimum_size = Vector2(width, height)
              button.add_theme_font_size_override("font_size", font_size)
              button.focus_mode = Control.FOCUS_NONE
              button.mouse_filter = Control.MOUSE_FILTER_STOP
              parent.add_child(button)
              _apply_mobile_button_style(button, false, false)
              return button

          func _apply_mobile_button_style(button: Button, selected: bool = false, circular: bool = false) -> void:
              var normal := StyleBoxFlat.new()
              normal.bg_color = Color(0.075, 0.09, 0.11, 0.55)
              normal.border_color = Color(0.84, 0.88, 0.9, 0.50) if not selected else Color(1.0, 0.91, 0.55, 0.98)
              normal.set_border_width_all(2 if selected else 1)
              normal.set_corner_radius_all(40 if circular else 6)
              normal.content_margin_left = 3.0
              normal.content_margin_right = 3.0
              normal.content_margin_top = 2.0
              normal.content_margin_bottom = 2.0
              var hover := normal.duplicate() as StyleBoxFlat
              hover.bg_color = Color(0.20, 0.24, 0.27, 0.72)
              var pressed := normal.duplicate() as StyleBoxFlat
              pressed.bg_color = Color(0.32, 0.35, 0.36, 0.82)
              pressed.border_color = Color(1.0, 1.0, 1.0, 0.98)
              var disabled := normal.duplicate() as StyleBoxFlat
              disabled.bg_color = Color(0.06, 0.07, 0.08, 0.28)
              disabled.border_color = Color(0.4, 0.42, 0.43, 0.24)
              button.add_theme_stylebox_override("normal", normal)
              button.add_theme_stylebox_override("hover", hover)
              button.add_theme_stylebox_override("pressed", pressed)
              button.add_theme_stylebox_override("disabled", disabled)
              button.add_theme_color_override("font_color", Color(0.96, 0.97, 0.97, 1.0))
              button.add_theme_color_override("font_hover_color", Color.WHITE)
              button.add_theme_color_override("font_pressed_color", Color.WHITE)
              button.add_theme_color_override("font_outline_color", Color(0.02, 0.03, 0.04, 0.85))
              button.add_theme_constant_override("outline_size", 1)
          """
          hud = replace_func(hud, "func _make_button(", "\nfunc _anchor_top_button", make_button)

          topbar = """func _build_top_bar() -> void:
              var menu_btn := _make_button("Ⅱ", "PauseMenuButton", root, 46, 46, 22)
              menu_btn.anchor_left = 1.0
              menu_btn.anchor_right = 1.0
              menu_btn.offset_left = -58.0
              menu_btn.offset_right = -12.0
              menu_btn.offset_top = 10.0
              menu_btn.offset_bottom = 56.0
              _apply_mobile_button_style(menu_btn, false, true)
              var inv_btn := _make_button("▤", "InventoryButton", root, 46, 46, 21)
              inv_btn.anchor_left = 1.0
              inv_btn.anchor_right = 1.0
              inv_btn.offset_left = -112.0
              inv_btn.offset_right = -66.0
              inv_btn.offset_top = 10.0
              inv_btn.offset_bottom = 56.0
              _apply_mobile_button_style(inv_btn, false, true)
              inv_btn.pressed.connect(func(): _toggle_inventory())
              biome_label = Label.new()
              biome_label.name = "BiomeLabel"
              biome_label.text = "Plains"
              biome_label.add_theme_font_size_override("font_size", 14)
              biome_label.anchor_left = 1.0
              biome_label.anchor_right = 1.0
              biome_label.anchor_top = 0.0
              biome_label.anchor_bottom = 0.0
              biome_label.offset_left = -270.0
              biome_label.offset_right = -122.0
              biome_label.offset_top = 10.0
              biome_label.offset_bottom = 32.0
              biome_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_RIGHT
              biome_label.mouse_filter = Control.MOUSE_FILTER_IGNORE
              root.add_child(biome_label)
              health_label = Label.new()
              health_label.name = "HealthLabel"
              health_label.text = "❤ 20/20   ◆ 20/20"
              health_label.add_theme_font_size_override("font_size", 16)
              health_label.anchor_left = 1.0
              health_label.anchor_right = 1.0
              health_label.anchor_top = 0.0
              health_label.anchor_bottom = 0.0
              health_label.offset_left = -290.0
              health_label.offset_right = -122.0
              health_label.offset_top = 34.0
              health_label.offset_bottom = 57.0
              health_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_RIGHT
              health_label.mouse_filter = Control.MOUSE_FILTER_IGNORE
              root.add_child(health_label)
              status_label = Label.new()
              status_label.name = "StatusLabel"
              status_label.text = ""
              status_label.visible = false
              status_label.add_theme_font_size_override("font_size", 15)
              status_label.add_theme_color_override("font_color", Color.WHITE)
              status_label.add_theme_color_override("font_shadow_color", Color(0, 0, 0, 0.92))
              status_label.add_theme_constant_override("shadow_offset_x", 1)
              status_label.add_theme_constant_override("shadow_offset_y", 1)
              status_label.anchor_left = 0.0
              status_label.anchor_right = 0.0
              status_label.anchor_top = 0.0
              status_label.anchor_bottom = 0.0
              status_label.offset_left = 14.0
              status_label.offset_right = 560.0
              status_label.offset_top = 14.0
              status_label.offset_bottom = 38.0
              status_label.mouse_filter = Control.MOUSE_FILTER_IGNORE
              root.add_child(status_label)
              pause_panel = PanelContainer.new()
              pause_panel.name = "PauseMenuPanel"
              pause_panel.anchor_left = 1.0
              pause_panel.anchor_right = 1.0
              pause_panel.anchor_top = 0.0
              pause_panel.anchor_bottom = 0.0
              pause_panel.offset_left = -224.0
              pause_panel.offset_right = -12.0
              pause_panel.offset_top = 62.0
              pause_panel.offset_bottom = 388.0
              pause_panel.z_index = 20
              pause_panel.visible = false
              var panel_style := StyleBoxFlat.new()
              panel_style.bg_color = Color(0.045, 0.055, 0.065, 0.94)
              panel_style.border_color = Color(0.72, 0.76, 0.78, 0.72)
              panel_style.set_border_width_all(1)
              panel_style.set_corner_radius_all(8)
              panel_style.content_margin_left = 8.0
              panel_style.content_margin_right = 8.0
              panel_style.content_margin_top = 8.0
              panel_style.content_margin_bottom = 8.0
              pause_panel.add_theme_stylebox_override("panel", panel_style)
              root.add_child(pause_panel)
              var menu_column := VBoxContainer.new()
              menu_column.name = "MenuActions"
              menu_column.add_theme_constant_override("separation", 5)
              pause_panel.add_child(menu_column)
              var save_btn := _make_button("Save world", "MenuSaveButton", menu_column, 192, 38, 14)
              save_btn.size_flags_horizontal = Control.SIZE_EXPAND_FILL
              save_btn.pressed.connect(func(): pause_panel.visible = false; save_pressed.emit())
              var load_btn := _make_button("Load world", "MenuLoadButton", menu_column, 192, 38, 14)
              load_btn.size_flags_horizontal = Control.SIZE_EXPAND_FILL
              load_btn.pressed.connect(func(): pause_panel.visible = false; load_pressed.emit())
              var creative_btn := _make_button("Creative / Survival", "PauseCreativeButton", menu_column, 192, 38, 14)
              creative_btn.size_flags_horizontal = Control.SIZE_EXPAND_FILL
              creative_btn.pressed.connect(func(): pause_panel.visible = false; mode_pressed.emit())
              var fly_btn := _make_button("Toggle flight", "PauseFlightButton", menu_column, 192, 38, 14)
              fly_btn.size_flags_horizontal = Control.SIZE_EXPAND_FILL
              fly_btn.pressed.connect(func(): pause_panel.visible = false; flight_pressed.emit())
              var use_btn := _make_button("Use / interact", "PauseUseButton", menu_column, 192, 38, 14)
              use_btn.size_flags_horizontal = Control.SIZE_EXPAND_FILL
              use_btn.pressed.connect(func(): pause_panel.visible = false; use_pressed.emit())
              var close_btn := _make_button("Resume", "PauseResumeButton", menu_column, 192, 38, 14)
              close_btn.size_flags_horizontal = Control.SIZE_EXPAND_FILL
              close_btn.pressed.connect(func(): pause_panel.visible = false)
              menu_btn.pressed.connect(func(): pause_panel.visible = not pause_panel.visible)
          """
          hud = replace_func(hud, "func _build_top_bar() -> void:", "\nfunc _build_joystick", topbar)

          actions = """func _build_action_buttons() -> void:
              var break_btn := _make_button("HIT", "BreakButton", root, 82, 82, 16)
              break_btn.anchor_left = 1.0
              break_btn.anchor_right = 1.0
              break_btn.anchor_top = 1.0
              break_btn.anchor_bottom = 1.0
              _apply_mobile_button_style(break_btn, false, true)
              break_btn.button_down.connect(func(): break_hold_changed.emit(true))
              break_btn.button_up.connect(func(): break_hold_changed.emit(false))
              break_btn.pressed.connect(func(): break_pressed.emit())
              var place_btn := _make_button("USE", "PlaceButton", root, 70, 70, 14)
              place_btn.anchor_left = 1.0
              place_btn.anchor_right = 1.0
              place_btn.anchor_top = 1.0
              place_btn.anchor_bottom = 1.0
              _apply_mobile_button_style(place_btn, false, true)
              place_btn.pressed.connect(func(): place_pressed.emit())
              var jump_btn := _make_button("↑", "JumpButton", root, 82, 82, 28)
              jump_btn.anchor_left = 1.0
              jump_btn.anchor_right = 1.0
              jump_btn.anchor_top = 1.0
              jump_btn.anchor_bottom = 1.0
              _apply_mobile_button_style(jump_btn, false, true)
              jump_btn.button_down.connect(func():
                  jump_hold_changed.emit(true)
                  jump_pressed.emit()
              )
              jump_btn.button_up.connect(func(): jump_hold_changed.emit(false))
              var down_btn := _make_button("⌄", "DescendButton", root, 64, 64, 24)
              down_btn.anchor_left = 1.0
              down_btn.anchor_right = 1.0
              down_btn.anchor_top = 1.0
              down_btn.anchor_bottom = 1.0
              _apply_mobile_button_style(down_btn, false, true)
              down_btn.button_down.connect(func(): descend_hold_changed.emit(true))
              down_btn.button_up.connect(func(): descend_hold_changed.emit(false))
              down_btn.pressed.connect(func(): descend_pressed.emit())
              var sprint_btn := _make_button("»", "SprintButton", root, 46, 46, 22)
              sprint_btn.anchor_left = 0.0
              sprint_btn.anchor_right = 0.0
              sprint_btn.anchor_top = 1.0
              sprint_btn.anchor_bottom = 1.0
              _apply_mobile_button_style(sprint_btn, false, true)
              sprint_btn.pressed.connect(func():
                  _sprint_enabled = not _sprint_enabled
                  sprint_toggled.emit(_sprint_enabled)
                  set_sprint_text(_sprint_enabled)
              )
          """
          hud = replace_func(hud, "func _build_action_buttons() -> void:", "\nfunc _build_hotbar", actions)

          # Compact icon-only hotbar.
          hud = hud.replace('hotbar.offset_left = -360\n    hotbar.offset_right = 360\n    hotbar.offset_top = -76\n    hotbar.offset_bottom = -10',
                            'hotbar.offset_left = -260\n    hotbar.offset_right = 260\n    hotbar.offset_top = -58\n    hotbar.offset_bottom = -6', 1)
          hud = hud.replace('var button := _make_button("%d\\n%s" % [i + 1, BlockRegistry.get_display_name(block_id)], "HotbarSlot%d" % i, hotbar, 76, 64, 12)',
                            'var button := _make_button("", "HotbarSlot%d" % i, hotbar, 54, 50, 12)', 1)
          hud = hud.replace('button.icon = _atlas_icon_for_block(block_id)\n        button.texture_filter = CanvasItem.TEXTURE_FILTER_NEAREST',
                            'button.icon = _atlas_icon_for_block(block_id)\n        button.tooltip_text = BlockRegistry.get_display_name(block_id)\n        button.texture_filter = CanvasItem.TEXTURE_FILTER_NEAREST\n        _apply_mobile_button_style(button, i == selected_hotbar_index, false)', 1)
          hud = hud.replace('hotbar_buttons[i].text = "%d\\n%s" % [i + 1, label_text]', 'hotbar_buttons[i].text = ""', 1)

          # Replace the responsive positioning of old rectangular controls.
          layout = """func _adapt_layout() -> void:
              if root == null:
                  return
              var viewport_size := get_viewport().get_visible_rect().size
              if viewport_size.x < 1.0 or viewport_size.y < 1.0:
                  return
              var scale := clampf(minf(viewport_size.x / 1280.0, viewport_size.y / 720.0), 0.60, 1.15)
              var pause_btn := root.get_node_or_null("PauseMenuButton") as Button
              var inv_btn := root.get_node_or_null("InventoryButton") as Button
              if pause_btn != null:
                  pause_btn.offset_left = -58.0 * scale
                  pause_btn.offset_right = -12.0 * scale
                  pause_btn.offset_top = 10.0 * scale
                  pause_btn.offset_bottom = 56.0 * scale
              if inv_btn != null:
                  inv_btn.offset_left = -112.0 * scale
                  inv_btn.offset_right = -66.0 * scale
                  inv_btn.offset_top = 10.0 * scale
                  inv_btn.offset_bottom = 56.0 * scale
              var break_btn := root.get_node_or_null("BreakButton") as Button
              if break_btn != null:
                  break_btn.offset_left = -100.0 * scale
                  break_btn.offset_right = -18.0 * scale
                  break_btn.offset_top = -292.0 * scale
                  break_btn.offset_bottom = -210.0 * scale
              var place_btn := root.get_node_or_null("PlaceButton") as Button
              if place_btn != null:
                  place_btn.offset_left = -190.0 * scale
                  place_btn.offset_right = -120.0 * scale
                  place_btn.offset_top = -224.0 * scale
                  place_btn.offset_bottom = -154.0 * scale
              var jump_btn := root.get_node_or_null("JumpButton") as Button
              if jump_btn != null:
                  jump_btn.offset_left = -100.0 * scale
                  jump_btn.offset_right = -18.0 * scale
                  jump_btn.offset_top = -122.0 * scale
                  jump_btn.offset_bottom = -40.0 * scale
              var descend_btn := root.get_node_or_null("DescendButton") as Button
              if descend_btn != null:
                  descend_btn.offset_left = -190.0 * scale
                  descend_btn.offset_right = -126.0 * scale
                  descend_btn.offset_top = -114.0 * scale
                  descend_btn.offset_bottom = -50.0 * scale
              var sprint_btn := root.get_node_or_null("SprintButton") as Button
              if sprint_btn != null:
                  sprint_btn.offset_left = 158.0 * scale
                  sprint_btn.offset_right = 204.0 * scale
                  sprint_btn.offset_top = -210.0 * scale
                  sprint_btn.offset_bottom = -164.0 * scale
              if joystick_control != null:
                  joystick_control.offset_left = 20.0 * scale
                  joystick_control.offset_right = 164.0 * scale
                  joystick_control.offset_top = -164.0 * scale
                  joystick_control.offset_bottom = -20.0 * scale
              if hotbar_container != null:
                  var hotbar_width := minf(viewport_size.x * 0.68, 520.0 * scale)
                  hotbar_container.offset_left = -hotbar_width * 0.5
                  hotbar_container.offset_right = hotbar_width * 0.5
                  hotbar_container.offset_top = -58.0 * scale
                  hotbar_container.offset_bottom = -6.0 * scale
                  var gap := float(maxi(1, roundi(3.0 * scale)))
                  hotbar_container.add_theme_constant_override("separation", int(gap))
                  var slot_width := maxf(24.0, (hotbar_width - float(maxi(0, hotbar_buttons.size() - 1)) * gap) / float(maxi(1, hotbar_buttons.size())))
                  for slot_button in hotbar_buttons:
                      slot_button.custom_minimum_size = Vector2(slot_width, 48.0 * scale)
                      slot_button.add_theme_font_size_override("font_size", maxi(7, roundi(12.0 * scale)))
              if biome_label != null:
                  biome_label.visible = viewport_size.x >= 620.0
                  biome_label.offset_left = -270.0 * scale
                  biome_label.offset_right = -122.0 * scale
                  biome_label.offset_top = 8.0 * scale
                  biome_label.offset_bottom = 30.0 * scale
                  biome_label.add_theme_font_size_override("font_size", maxi(10, roundi(14.0 * scale)))
              if health_label != null:
                  health_label.offset_left = -290.0 * scale
                  health_label.offset_right = -122.0 * scale
                  health_label.offset_top = 33.0 * scale
                  health_label.offset_bottom = 56.0 * scale
                  health_label.add_theme_font_size_override("font_size", maxi(10, roundi(16.0 * scale)))
              if status_label != null:
                  status_label.offset_right = viewport_size.x - 24.0 * scale
                  status_label.offset_top = 12.0 * scale
                  status_label.offset_bottom = 36.0 * scale
                  status_label.add_theme_font_size_override("font_size", maxi(10, roundi(15.0 * scale)))
              if pause_panel != null:
                  var panel_width := minf(212.0 * scale, viewport_size.x * 0.55)
                  pause_panel.offset_left = -panel_width - 12.0 * scale
                  pause_panel.offset_right = -12.0 * scale
                  pause_panel.offset_top = 62.0 * scale
                  pause_panel.offset_bottom = 388.0 * scale
              if inventory_panel != null:
                  var panel_width := minf(620.0, viewport_size.x * 0.92)
                  var panel_height := minf(576.0, viewport_size.y * 0.84)
                  inventory_panel.offset_left = -panel_width * 0.5
                  inventory_panel.offset_right = panel_width * 0.5
                  inventory_panel.offset_top = -panel_height * 0.5
                  inventory_panel.offset_bottom = panel_height * 0.5
                  if inventory_grid != null:
                      inventory_grid.columns = 5 if panel_width >= 580.0 else (3 if panel_width >= 380.0 else 2)
                      var item_width := maxf(92.0, (panel_width - 32.0 - float(inventory_grid.columns - 1) * 4.0) / float(inventory_grid.columns))
                      for child in inventory_grid.get_children():
                          if child is Button:
                              child.custom_minimum_size.x = item_width
              if station_panel != null:
                  var station_width := minf(470.0, viewport_size.x * 0.90)
                  var station_height := minf(470.0, viewport_size.y * 0.80)
                  station_panel.offset_left = -station_width * 0.5
                  station_panel.offset_right = station_width * 0.5
                  station_panel.offset_top = -station_height * 0.5
                  station_panel.offset_bottom = station_height * 0.5
          """
          hud = replace_func(hud, "func _adapt_layout() -> void:", "\nfunc show_message", layout)
          hud = hud.replace('if _message_timer <= 0.0 and status_label != null and status_label.text.begins_with("•"):\n        status_label.text = "• World ready"',
                            'if _message_timer <= 0.0 and status_label != null:\n        status_label.text = ""\n        status_label.visible = false', 1)
          hud = hud.replace('if status_label != null:\n        status_label.text = "• " + message\n        _message_timer = seconds',
                            'if status_label != null:\n        status_label.text = "• " + message\n        status_label.visible = true\n        _message_timer = seconds', 1)
          hud = replace_func(hud, "func set_mode_text(is_creative: bool) -> void:", "\nfunc set_inventory_state",
                             """func set_mode_text(is_creative: bool) -> void:
              _creative_mode = is_creative
              var mode_btn := root.get_node_or_null("PauseMenuPanel/MenuActions/PauseCreativeButton") as Button
              if mode_btn != null:
                  mode_btn.text = "Mode: Creative" if is_creative else "Mode: Survival"
              _refresh_hotbar()
          """)
          hud = hud.replace('b.modulate = Color(1.0, 0.9, 0.55, 1.0)\n        else:\n            b.modulate = Color(1, 1, 1, 1)',
                            'b.modulate = Color(1, 1, 1, 1)\n            _apply_mobile_button_style(b, true, false)\n        else:\n            b.modulate = Color(1, 1, 1, 1)\n            _apply_mobile_button_style(b, false, false)', 1)
          hud = hud.replace('sprint_btn.modulate = Color(0.78, 0.92, 0.66, 1.0) if enabled else Color.WHITE',
                            'sprint_btn.modulate = Color(1, 1, 1, 1)\n        _apply_mobile_button_style(sprint_btn, enabled, true)', 1)
          hud_path.write_text(hud)

          # Wider landscape devices should fill the screen rather than being letterboxed.
          project_settings = project / "project.godot"
          settings = project_settings.read_text()
          if "window/stretch/aspect=" in settings:
              settings = "\n".join('window/stretch/aspect="expand"' if line.startswith("window/stretch/aspect=") else line for line in settings.splitlines()) + "\n"
          else:
              settings = settings.replace('window/stretch/mode="canvas_items"', 'window/stretch/mode="canvas_items"\nwindow/stretch/aspect="expand"')
          project_settings.write_text(settings)
          PY
      - name: Set up Java for Godot Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"

      - name: Install Python texture-generation dependency
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore deterministic texture files in the build workspace
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python "$PROJECT_DIR/tools/rebuild_block_textures_from_atlas.py"

      - name: Download Godot 4.7.2 and matching Android export templates
        run: |
          set -euo pipefail
          curl --fail --location --show-error             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"             --output "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl --fail --location --show-error             "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"             --output "$RUNNER_TEMP/godot-templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q "$RUNNER_TEMP/godot-templates.tpz" -d "$RUNNER_TEMP/templates"
          if [ -d "$RUNNER_TEMP/templates/templates" ]; then
            cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          else
            cp -a "$RUNNER_TEMP/templates/." "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          fi
          printf '4.7.2.stable' > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          "$GODOT_BIN" --version

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and export Android debug APK
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-import.log"; then
            echo "GDScript errors found during import; refusing to publish a broken APK."
            exit 1
          fi
          echo "Running a headless main-scene startup smoke test..."
          timeout 120s "$GODOT_BIN" --headless --path "$PROJECT_DIR" --quit-after 3 2>&1 | tee "$RUNNER_TEMP/godot-runtime.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "Runtime startup errors detected; refusing to publish this APK."
            exit 1
          fi
          if ! grep -q "Flatworld startup: touch HUD created" "$RUNNER_TEMP/godot-runtime.log"; then
            echo "The main scene did not finish creating the player and touch HUD."
            exit 1
          fi
          echo "Headless startup smoke test passed."
          mkdir -p "$PROJECT_DIR/build"
          "$GODOT_BIN" --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/Flatworld-Creative-debug.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" "$RUNNER_TEMP/godot-export.log"; then
            echo "GDScript errors found during export; refusing to publish a broken APK."
            exit 1
          fi
          test -s "$PROJECT_DIR/build/Flatworld-Creative-debug.apk"
          ls -lh "$PROJECT_DIR/build/Flatworld-Creative-debug.apk"

      - name: Publish the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flatworld-Creative-debug-APK
          path: ${{ env.PROJECT_DIR }}/build/Flatworld-Creative-debug.apk
          if-no-files-found: error
          retention-days: 14
